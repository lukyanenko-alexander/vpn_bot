[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.20.0",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "alembic==1.16.1",
    "httpx==0.28.1",
    "pydantic-settings==2.9.1",
    "redis[hiredis]==5.3.0",
    "arq==0.26.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "pytest-mock==3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
